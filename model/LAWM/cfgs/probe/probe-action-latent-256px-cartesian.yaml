app: probe

common:
  patch_size: 16
  tubelet_size: 2
  crop_size: 256
  fpcs: 12

train:
  dataset_type: straightening_probe
  patch_size: 16
  tubelet_size: 2
  crop_size: 256
  fpcs: 12
  batch_size: 128
  waypoint_key: midlane_wp
  n_waypoints: &n_waypoints 12
  waypoint_coordinate_mode: cartesian
  wp_normalize: true
  wp_clip: [20.0, 8.0]
  sampling:
    enabled: true
    multi_fraction: 40
    uni_fraction: 50
    seed: 0
  # Set to a directory of pre-cached latents to skip the frozen world model.
  # Generate with: python -m app.probe.cache_latents --fname <this_yaml> --cache_dir <dir>
  cached_latents_dir: ./cached_latents/probe
  datasets_path:
    - ../../../Autonomous_Dataset/LAWM1/recording_20260204_010805_spatial/
    - ../../../Autonomous_Dataset/LAWM1/recording_20260308_212005_spatial/
    - ../../../Autonomous_Dataset/LAWM1/recording_20260317_214033_best_spatial/
    - ../../../Autonomous_Dataset/LAWM1/recording_20260317_233603_spatial/
    - ../../../Autonomous_Dataset/LAWM1/recording_20260318_083409_best_spatial/
    - ../../../Autonomous_Dataset/LAWM1/recording_20260323_200940_best_spatial/
    - ../../../Autonomous_Dataset/LAWM1/recording_20260329_233141_best_spatial/
    - ../../../Autonomous_Dataset/LAWM1/recording_20260323_204100_best_spatial/
    - ../../../Autonomous_Dataset/LAWM1/recording_20260323_210357_best_spatial/
    - ../../../Autonomous_Dataset/LAWM1/recording_20260329_164940_best_spatial/
    - ../../../Autonomous_Dataset/LAWM1/recording_20260410_152712_best_spatial/
    - ../../../Autonomous_Dataset/LAWM1/recording_20260410_154404_best_spatial/
    - ../../../Autonomous_Dataset/LAWM1/recording_20260410_160255_best_spatial/
    - ../../../Autonomous_Dataset/LAWM2/recording_20260204_010805_spatial/
    - ../../../Autonomous_Dataset/LAWM2/recording_20260308_212005_spatial/
    - ../../../Autonomous_Dataset/LAWM2/recording_20260317_214033_best_spatial/
    - ../../../Autonomous_Dataset/LAWM2/recording_20260317_233603_spatial/
    - ../../../Autonomous_Dataset/LAWM2/recording_20260318_083409_best_spatial/
    - ../../../Autonomous_Dataset/LAWM2/recording_20260323_200940_best_spatial/
    - ../../../Autonomous_Dataset/LAWM2/recording_20260329_233141_best_spatial/
    - ../../../Autonomous_Dataset/LAWM2/recording_20260323_204100_best_spatial/
    - ../../../Autonomous_Dataset/LAWM2/recording_20260323_210357_best_spatial/
    - ../../../Autonomous_Dataset/LAWM2/recording_20260329_164940_best_spatial/
    - ../../../Autonomous_Dataset/LAWM2/recording_20260410_152712_best_spatial/
    - ../../../Autonomous_Dataset/LAWM2/recording_20260410_154404_best_spatial/
    - ../../../Autonomous_Dataset/LAWM2/recording_20260410_160255_best_spatial/

loader_setup:
  num_workers: 8
  persistent_workers: true
  pin_mem: true

data_aug:
  auto_augment: false
  horizontal_flip: false
  motion_shift: false
  random_resize_aspect_ratio:
    - 1.0
    - 1.0
  random_resize_scale:
    - 1.0
    - 1.0
  reprob: 0.0

model:
  compile: false
  # enc + world_model architecture is auto-loaded from the run config below.
  # Only override keys you want to change (e.g. crop_size for a different res).
  enc: {}
  world_model:
    checkpoint_dir: ./Experiment/straightening/run1
    prefer_best: true
  probe:
    decoder:
      type: ActionDecoder
      n_waypoints: *n_waypoints
      d_model: 512
      n_heads: 8
      n_layers: 4
      dim_feedforward: 1024
      mlp_hidden: 128
      dropout: 0.1

optimization:
  anneal: 40
  epochs: 40
  warmup: 0
  ipe: 100
  lr: 5.0e-4
  start_lr: 1.0e-6
  weight_decay: 0.03
  final_lr: 0.0
  final_weight_decay: 0.03
  grad_clip_norm: 1.0
  betas:
    - 0.9
    - 0.999
  eps: 1.0e-8

loss:
  alpha_lane: 8.0
  beta_lane: 4.0
  alpha_inter: 6.0
  beta_inter: 4.0
  lambda_heading: 1.5
  lambda_endpoint: 0.0
  lambda_smooth: 0.3
  tau_start: 0.3
  tau_end: 1.0
  sl1_beta: 0.3  # wider quadratic zone → error-proportional gradients

checkpoint:
  patience: 10
  min_delta: 0.0

logging:
  progress_type: table
  save_csv: true
  save_batch_csv: false
  save_epoch_csv: true

meta:
  save_root_dir: ./Experiment
  dtype: bfloat16
  save_every_freq: 5
  seed: 239
  sync_gc: true
