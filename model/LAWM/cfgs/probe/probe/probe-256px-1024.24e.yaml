common: &common_settings
  patch_size: &patch_size 16
  tubelet_size: &tubelet_size 2
  crop_size: &crop_size 256
  nclips: &nclips 1
  fpcs: &fpcs 16

app: probe

logging:
  progress_type: table
  save_csv: true
  save_batch_csv: true
  save_epoch_csv: true

loader_setup: &loader_settings
  num_workers: 4
  persistent_workers: true
  pin_mem: true

train:
  <<: [*common_settings, *loader_settings]
  batch_size: 16
  allow_clip_overlap: true
  random_jiggle: true
  agg_method: interpolate
  train_fraction: 0.85
  val_fraction: 0.15
  datasets:
  - name: "carla"
    path: "./csv_metadata/probe/Carla_recording_20251025_142727_best_spatial.csv"
    fps: 4
  - name: "carla"
    path: "./csv_metadata/probe/Carla_recording_20260204_010805_spatial.csv"
    fps: 4
  - name: "carla"
    path: "./csv_metadata/probe/Carla_recording_20260308_212005_spatial.csv"
    fps: 4
  - name: "carla"
    path: "./csv_metadata/probe/Carla_recording_20260317_214033_best_spatial.csv"
    fps: 4
  - name: "carla"
    path: "./csv_metadata/probe/Carla_recording_20260317_233603_spatial.csv"
    fps: 4
  - name: "carla"
    path: "./csv_metadata/probe/Carla_recording_20260323_200940_best_spatial.csv"
    fps: 4
  - name: "carla"
    path: "./csv_metadata/probe/Carla_recording_20260323_204100_best_spatial.csv"
    fps: 4
  - name: "carla"
    path: "./csv_metadata/probe/Carla_recording_20260323_210357_best_spatial.csv"
    fps: 4
  - name: "carla"
    path: "./csv_metadata/probe/Carla_recording_20260329_164940_best_spatial.csv"
    fps: 4
  - name: "carla"
    path: "./csv_metadata/probe/Carla_recording_20260329_233141_best_spatial.csv"
    fps: 4

data_aug:
  auto_augment: false
  horizontal_flip: false
  motion_shift: false
  normalize_targets: true
  random_resize_aspect_ratio:
  - 1.0
  - 1.0
  random_resize_scale:
  - 1.0
  - 1.0
  reprob: 0.0

meta:
  dtype: bfloat16
  save_every_freq: 5
  save_root_dir: ./Experiment
  seed: 239
  sync_gc: true
  continue_train: false
  continue_from_run: null
  resume_prefer_best: true

model:
  compile: false
  common: &common_model
    action_pframe: 1
    use_sdpa: true

  enc:
    <<: *common_settings
    name: vjepa2_1_vit_base_384
    load_from: facebookresearch/vjepa2
    source: github
    use_activation_checkpointing: true

  probe:
    name: "EfficientProbe"
    output_dim: &output_dim 2
    hidden_dim: null
    max_frames: *fpcs
    tubelet_size: *tubelet_size
    num_heads: 8
    num_queries: 32
    depth: 1
    mlp_ratio: 4.0
    init_std: 0.02
    qkv_bias: true
    dropout: 0.1
    use_activation_checkpointing: true
    init_scales: null
    init_shifts: null

optimization:
  anneal: 130
  epochs: 200
  warmup: 50
  final_lr: 0.0
  final_weight_decay: 0.04
  ipe: 150
  lr: 0.000225
  start_lr: 0.000045
  weight_decay: 0.04  
  gradient_optimizer:
    type: normal
    params: 
      reduction: mean

checkpoint:
  patience: 10
  min_delta: 0.0

loss:
  enable_velocity: true
  enable_steer: false
  enable_lateral_error: true
  velocity_loss: log_cosh
  steer_loss: log_cosh
  lateral_error_loss: log_cosh
  velocity_idx: 0
  steer_idx: 1
  lateral_error_idx: 1
  velocity_log_var: 0.0
  steer_log_var: 0.0
  lateral_error_log_var: 0.0
  reduction: mean