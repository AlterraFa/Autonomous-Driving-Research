
config:
  initLR: 7.5e-4
  targetLR: 1e-7
  epochs: 300
  components: 5
  l1: 1e-4
  l2: 1e-4
  l1_weight: 1e-2
  l2_weight: 1e-3
  target_std: [0.6, 0.8, 1.0, 1.2, 1.4, 1.6]
  target_sep: [0.6, 0.8, 1.0, 1.2, 1.4, 1.6]
  patience: 50
  droprate: 0.30

loss_contrib:
  mse_contrib       :  1.5
  nll_contrib       :  0.75
  std_reg_contrib   :  0.7
  entropy_contrib   : -0.3   # negative to maximize entropy. But not too much to enforce uniformity
  repulsion_contrib :  0.0
  l1_weight_contrib :  0.5
  l2_weight_contrib :  0.5
  l1_contrib        :  1.0
  l2_contrib        :  1.0